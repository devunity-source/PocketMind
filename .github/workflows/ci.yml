name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev pkg-config
      - name: Test PocketMindCore
        run: bash scripts/test-core.sh

  ios:
    name: iOS build, tests and unsigned IPA
    # Needs an image with Xcode 16 or newer (Swift 6 toolchain, iOS 18 SDK).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run all tests (core + app on simulator)
        run: bash scripts/test.sh
      - name: Build unsigned IPA
        run: bash scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketMind-unsigned-ipa
          path: build/PocketMind-unsigned.ipa
          if-no-files-found: error
