# XcodeGen project definition. Generate the Xcode project with:  xcodegen generate
# (see scripts/bootstrap.sh). The .xcodeproj is a build product and is not committed.
name: PocketMind

options:
  bundleIdPrefix: app.pocketmind
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The app and its tests are compiled with the Swift 6 toolchain in Swift 5 language
    # mode with complete concurrency checking reported as warnings. PocketMindCore is
    # built in full Swift 6 language mode.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  PocketMindCore:
    path: Packages/PocketMindCore
  LocalAI:
    path: Packages/LocalAI

targets:
  PocketMind:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PocketMindCore
        product: PocketMindCore
      - package: LocalAI
        product: LocalAI
    settings:
      base:
        # Change this to an identifier you own before signing (see docs/BUILD.md).
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketmind.PocketMind
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  PocketMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: PocketMind
      - package: PocketMindCore
        product: PocketMindCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketmind.PocketMindTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketMind.app/PocketMind"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PocketMind:
    build:
      targets:
        PocketMind: all
        PocketMindTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketMindTests
    archive:
      config: Release
